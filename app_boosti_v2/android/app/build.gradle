plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.app_boosti_v2"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions "app"
    productFlavors {
        client {
            dimension "app"
            applicationId "com.jahtlabs.boostipos.client"
            resValue "string", "app_name", "Boosti POS"
        }
        admin {
            dimension "app"
            applicationId "com.jahtlabs.boostipos.admin"
            resValue "string", "app_name", "Boosti POS Admin"
        }
    }

    // ⚠️ El entrypoint NO se puede fijar acá.
    //
    // Existe un `flutter { target = "lib/main_client.dart" }` por flavor, pero
    // Flutter 3.47.2 lo ignora: sigue buscando `lib/main.dart`, que ya no
    // existe (pasó a ser `app.dart` al separar cliente de admin) y falla con
    // `Target file "lib/main.dart" not found`. Verificado: el bloque estaba
    // puesto y el build seguía fallando igual.
    //
    // Hay que pasar el entrypoint por CLI:
    //     flutter build apk --flavor client --target lib/main_client.dart
    //     flutter build apk --flavor admin  --target lib/main_admin.dart

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}