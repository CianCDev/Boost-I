name: Shorebird Build

# 🐧 ubuntu-latest, no windows-latest.
#
# Gradle 8.14 en Windows falla con "Could not move temporary workspace".
# No hay fix en la línea 8.x y Flutter 3.47 exige Gradle >= 8.14, así que
# no hay versión intermedia que funcione. El runner de Linux no toca esa
# línea, así que el build pasa.
#
# Para el artefacto Android da igual: Dart compila igual en cualquier OS
# y el AAB no depende del runner.
#
# ⚠️ Esto NO sirve para el patch de la app DESKTOP Windows. Ese va por
# CMake/MSBuild, no por Gradle — el bug no le aplica — pero tampoco se
# puede generar desde Linux. Para eso, runner Windows.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción (release o patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - release
          - patch
      flavor:
        description: 'Flavor (client o admin)'
        required: true
        default: 'client'
        type: choice
        options:
          - client
          - admin
      release_version:
        description: 'Versión de release (solo para patch, ej: 1.1.1+7)'
        required: false
        default: '1.1.1+7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Va en app_boosti_v2/, NO en la raíz: Shorebird corre con
      # working-directory ./app_boosti_v2 y el --dart-define-from-file
      # se resuelve relativo al cwd del build.
      #
      # El secreto va por `env:` y NO interpolado con ${{ }}: si el JSON
      # tuviera un `$` (un precio, una clave), bash lo expandiría y
      # corrompería el archivo. Con `env:` el valor llega intacto.
      #
      # `printf '%s'` en vez de `echo`: no interpreta flags si el valor
      # empieza con `-` ni agrega un salto de línea extra.
      - name: Materializar env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > app_boosti_v2/env.json
          # jq empty valida la sintaxis. ubuntu-latest trae jq
          # preinstalado. Falla acá en 1 segundo en vez de perder 10
          # minutos en descubrir el problema en medio del build.
          if ! jq empty app_boosti_v2/env.json; then
            echo "::error::ENV_JSON no es JSON valido. Suele ser un salto de linea o CRLF pegado al copiarlo en GitHub Secrets."
            exit 1
          fi

      # El keystore va en android/boostikeystore.jks, igual que en el
      # build local. `storeFile=../boostikeystore.jks` es relativo a
      # android/app/ porque `file()` en app/build.gradle:68 resuelve
      # contra el módulo, no contra la raíz de android/.
      #
      # Misma trumpa del env: el base64 se pega en GitHub y suele
      # arrastrar saltos de linea, que `base64 --decode` no tolera
      # salvo con -i. Se normalizan antes de decodificar.
      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app_boosti_v2/android/boostikeystore.jks
          # Un .jks arranca con magic 0xFEEDFEED. Si no, no es un keystore.
          if ! head -c 4 app_boosti_v2/android/boostikeystore.jks | od -An -tx1 | grep -qi 'feed feed'; then
            echo "::error::KEYSTORE_BASE64 no decodifica a un keystore valido. Revisa el secreto en GitHub."
            exit 1
          fi

      - name: Crear key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > app_boosti_v2/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../boostikeystore.jks
          EOF

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Shorebird Release
        if: ${{ inputs.action == 'release' }}
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            -- --dart-define-from-file=env.json

      - name: Shorebird Patch
        if: ${{ inputs.action == 'patch' }}
        uses: shorebirdtech/shorebird-patch@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            -- --dart-define-from-file=env.json