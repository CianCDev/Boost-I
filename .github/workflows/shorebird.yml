name: Shorebird Build

# 🐧 ubuntu-latest, no windows-latest.
#
# Gradle 8.14 en Windows falla con "Could not move temporary workspace".
# No hay fix en la línea 8.x y Flutter 3.47 exige Gradle >= 8.14, así que
# no hay versión intermedia que funcione. El runner de Linux no toca esa
# línea, así que el build pasa.
#
# Para el artefacto Android da igual: Dart compila igual en cualquier OS
# y el AAB no depende del runner.
#
# ⚠️ Esto NO sirve para el patch de la app DESKTOP Windows. Ese va por
# CMake/MSBuild, no por Gradle — el bug no le aplica — pero tampoco se
# puede generar desde Linux. Para eso, runner Windows.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción (release, patch o apk)'
        required: true
        default: 'patch'
        type: choice
        options:
          - release
          - patch
          - apk
      flavor:
        description: 'Flavor (client o admin)'
        required: true
        default: 'client'
        type: choice
        options:
          - client
          - admin
      release_version:
        description: 'Versión de release ya publicada (solo para patch)'
        required: false
        default: '1.1.5+11'

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    if: ${{ inputs.action != 'windows' }}
    outputs:
      apk-path: ${{ steps.upload-apk.outputs.apk-path }}
      aab-path: ${{ steps.upload-aab.outputs.aab-path }}

    steps:
      - name: Que commit se esta compilando
        run: |
          echo "::notice::commit  = ${GITHUB_SHA}"
          echo "::notice::workflow= ${GITHUB_WORKFLOW}"
          echo "::notice::event   = ${GITHUB_EVENT}"
          echo "::notice::Si el commit no es el que esperabas, el push todavia no llego."
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del checkout
        run: |
          git log -1 --format='commit  = %H%nautor  = %an%nmensaje= %s'
          echo ""
          echo "wrapper de Gradle:"
          grep distributionUrl app_boosti_v2/android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "keystore PKCS12 (debe existir en minusculas):"
          ls -la app_boosti_v2/lib/features/pos/presentation/widgets/pedidos/multi_select_dialog.dart
        shell: bash

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter para el analyze
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Verificar que el project compila
        working-directory: ./app_boosti_v2
        run: |
          flutter --version
          flutter pub get
          # --no-fatal-infos: el analyzer devuelve exit 1 con solo infos.
          # Hoy son 12 avisos de `SentryEvent.extra`, que esta deprecado pero
          # no tiene reemplazo para LEER el mapa de datos extra: el scrubber
          # de PII tiene que recorrerlo igual. Los errores y warnings siguen
          # siendo fatales.
          flutter analyze --no-pub --no-fatal-infos
        shell: bash

      - name: Materializar env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > app_boosti_v2/env.json
          if ! jq empty app_boosti_v2/env.json; then
            echo "::error::ENV_JSON no es JSON valido. Suele ser un salto de linea o CRLF pegado al copiarlo en GitHub Secrets."
            exit 1
          fi

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app_boosti_v2/android/boostikeystore.jks
          if ! keytool -list -keystore app_boosti_v2/android/boostikeystore.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_BASE64 no abre como keystore, o KEYSTORE_PASSWORD no coincide."
            echo "::error::Si es PKCS12 el archivo empieza en 30 82, no en fe ed. keytool acepta ambos."
            exit 1
          fi

      - name: Crear key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > app_boosti_v2/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../boostikeystore.jks
          EOF

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Shorebird Release
        if: ${{ inputs.action == 'release' }}
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            --flutter-version=3.47.2
            -- --dart-define-from-file=env.json

      - name: Shorebird Patch
        if: ${{ inputs.action == 'patch' }}
        uses: shorebirdtech/shorebird-patch@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            --allow-asset-diffs
            -- --dart-define-from-file=env.json

      # ──────────────────────────────────────────────────────────────
      # APK instalable CON el motor de Shorebird (OTA).
      #
      # OJO: `flutter build apk` usa el motor ESTANDAR de Flutter, asi que
      # produce un APK que NUNCA recibe parches. Solo los binarios que
      # construye Shorebird llevan el motor parcheado.
      #
      # `shorebird build apk` ya no existe en la CLI 1.6.x. La via correcta
      # es `shorebird releases get-apks`: descarga el AAB publicado de esta
      # version y lo convierte en un APK universal con bundletool. Ese APK
      # sale del mismo AAB que ya tiene OTA, asi que instalandolo a mano
      # tambien se reciben parches.
      #
      # No publica nada ni gasta numero de version: se puede correr las
      # veces que haga falta sobre un release ya existente.
      # ──────────────────────────────────────────────────────────────
      - name: Obtener APK instalable con OTA
        if: ${{ inputs.action == 'release' || inputs.action == 'apk' }}
        working-directory: ./app_boosti_v2
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d '\r')
          echo "Version de pubspec: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo leer la version de pubspec.yaml"
            exit 1
          fi
          shorebird releases get-apks \
            --flavor=${{ inputs.flavor }} \
            --release-version "$VERSION" \
            --out build/apks

          # get-apks firma el APK con la llave de DEBUG ("CN=Android Debug").
          # Instalarlo encima de la app real falla con firma distinta, y ademas
          # cualquiera podria reemplazar el binario. Se re-firma con la llave
          # del proyecto, la misma del AAB y del APK historico.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "::error::No se encontro apksigner/zipalign en $ANDROID_HOME/build-tools"
            exit 1
          fi

          "$ZIPALIGN" -f -p 4 build/apks/universal.apk build/apks/aligned.apk
          "$APKSIGNER" sign \
            --ks android/boostikeystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/apks/boosti-ota.apk \
            build/apks/aligned.apk

          echo "--- firma del APK final ---"
          "$APKSIGNER" verify --print-certs build/apks/boosti-ota.apk

      - name: Localizar APK firmado
        id: find-apk
        # Solo tiene sentido en release/apk: un `shorebird patch` NO
        # produce APK completo (empaqueta Dart+assets contra el release
        # ya publicado), y fallar aquí en modo patch dejó el run en rojo
        # aunque el patch se hubiera publicado con éxito.
        if: ${{ inputs.action == 'release' || inputs.action == 'apk' }}
        run: |
          APK=app_boosti_v2/build/apks/boosti-ota.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No se genero build/apks/boosti-ota.apk"
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Encontrado: $APK"

      - name: Subir APK como artifact
        id: upload-apk
        if: ${{ (inputs.action == 'release' || inputs.action == 'apk') && steps.find-apk.outputs.apk != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: boosti-${{ inputs.flavor }}-apk
          path: ${{ steps.find-apk.outputs.apk }}
          retention-days: 90
          compression-level: 0

      - name: Localizar AAB (para Play Console)
        id: find-aab
        if: ${{ inputs.action == 'release' }}
        run: |
          AAB=$(find app_boosti_v2/build/app/outputs/bundle -name "*.aab" -type f | head -1)
          if [ -z "$AAB" ]; then
            echo "::warning::No se encontro AAB en build/app/outputs/bundle"
          else
            echo "aab=$AAB" >> $GITHUB_OUTPUT
            echo "Encontrado: $AAB"
          fi

      - name: Subir AAB como artifact
        id: upload-aab
        if: ${{ inputs.action == 'release' && steps.find-aab.outputs.aab != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: boosti-${{ inputs.flavor }}-aab
          path: ${{ steps.find-aab.outputs.aab }}
          retention-days: 90
          compression-level: 0
