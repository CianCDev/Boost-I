name: Shorebird Build

# 🐧 ubuntu-latest, no windows-latest.
#
# Gradle 8.14 en Windows falla con "Could not move temporary workspace".
# No hay fix en la línea 8.x y Flutter 3.47 exige Gradle >= 8.14, así que
# no hay versión intermedia que funcione. El runner de Linux no toca esa
# línea, así que el build pasa.
#
# Para el artefacto Android da igual: Dart compila igual en cualquier OS
# y el AAB no depende del runner.
#
# ⚠️ Esto NO sirve para el patch de la app DESKTOP Windows. Ese va por
# CMake/MSBuild, no por Gradle — el bug no le aplica — pero tampoco se
# puede generar desde Linux. Para eso, runner Windows.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción (release o patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - release
          - patch
      flavor:
        description: 'Flavor (client o admin)'
        required: true
        default: 'client'
        type: choice
        options:
          - client
          - admin
      release_version:
        description: 'Versión de release (solo para patch, ej: 1.1.1+7)'
        required: false
        default: '1.1.1+7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Printing the commit BEFORE the build, on purpose.
      #
      # "Re-run jobs" keeps the original headSha, and a dispatch fired
      # right after a push can pick up the previous ref. Both happened
      # here: three runs failed diagnosing code that was already fixed,
      # because the log only showed the symptom and never which commit
      # was actually compiled.
      #
      # First thing in the log: which code is this run really building.
      - name: Que commit se esta compilando
        run: |
          echo "::notice::commit  = ${GITHUB_SHA}"
          echo "::notice::workflow= ${GITHUB_WORKFLOW}"
          echo "::notice::event   = ${GITHUB_EVENT}"
          echo "::notice::Si el commit no es el que esperabas, el push todavia no llego."
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5

      - name: Estado del checkout
        run: |
          git log -1 --format='commit  = %H%nautor  = %an%nmensaje= %s'
          echo ""
          echo "wrapper de Gradle:"
          grep distributionUrl app_boosti_v2/android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "keystore PKCS12 (debe existir en minusculas):"
          ls -la app_boosti_v2/lib/features/pos/presentation/widgets/pedidos/multi_select_dialog.dart
        shell: bash

      # Falla en 2 segundos si el casteo del archivo no coincide con lo
      # que espera el import. Antes tardaba 6 minutos de build.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Falla en ~1 minuto si hay un import roto o un casteo que no
      # coincide. Antes tardaba 6 minutos de build para decir lo mismo.
      - name: Verificar que el project compila
        working-directory: ./app_boosti_v2
        run: |
          flutter pub get
          flutter analyze --no-pub
        shell: bash

      # Va en app_boosti_v2/, NO en la raíz: Shorebird corre con
      # working-directory ./app_boosti_v2 y el --dart-define-from-file
      # se resuelve relativo al cwd del build.
      #
      # El secreto va por `env:` y NO interpolado con ${{ }}: si el JSON
      # tuviera un `$` (un precio, una clave), bash lo expandiría y
      # corrompería el archivo. Con `env:` el valor llega intacto.
      #
      # `printf '%s'` en vez de `echo`: no interpreta flags si el valor
      # empieza con `-` ni agrega un salto de línea extra.
      - name: Materializar env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > app_boosti_v2/env.json
          # jq empty valida la sintaxis. ubuntu-latest trae jq
          # preinstalado. Falla acá en 1 segundo en vez de perder 10
          # minutos en descubrir el problema en medio del build.
          if ! jq empty app_boosti_v2/env.json; then
            echo "::error::ENV_JSON no es JSON valido. Suele ser un salto de linea o CRLF pegado al copiarlo en GitHub Secrets."
            exit 1
          fi

      # El keystore va en android/boostikeystore.jks, igual que en el
      # build local. `storeFile=../boostikeystore.jks` es relativo a
      # android/app/ porque `file()` en app/build.gradle:68 resuelve
      # contra el módulo, no contra la raíz de android/.
      #
      # Misma trumpa del env: el base64 se pega en GitHub y suele
      # arrastrar saltos de linea, que `base64 --decode` no tolera
      # salvo con -i. Se normalizan antes de decodificar.
      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app_boosti_v2/android/boostikeystore.jks
          # Valida con keytool y no con los magic bytes a mano.
          #
          # Un keystore arranca con 0xFEEDFEED (JKS legacy) o con
          # 0x30 0x82 (PKCS12 / ASN.1 SEQUENCE). El de este proyecto es
          # PKCS12, asi que una comprobacion de "feed feed" rechazaba un
          # keystore perfectamente valido: fue lo que rompio el primer
          # run en CI.
          #
          # keytool ademas valida el storePassword contra el archivo, asi
          # que un secret equivocado se detecta aqui y no en la firma.
          if ! keytool -list -keystore app_boosti_v2/android/boostikeystore.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_BASE64 no abre como keystore, o KEYSTORE_PASSWORD no coincide."
            echo "::error::Si es PKCS12 el archivo empieza en 30 82, no en fe ed. keytool acepta ambos."
            exit 1
          fi

      - name: Crear key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > app_boosti_v2/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../boostikeystore.jks
          EOF

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Shorebird Release
        if: ${{ inputs.action == 'release' }}
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            -- --dart-define-from-file=env.json

      - name: Shorebird Patch
        if: ${{ inputs.action == 'patch' }}
        uses: shorebirdtech/shorebird-patch@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          working-directory: ./app_boosti_v2
          args: >-
            --flavor=${{ inputs.flavor }}
            --target=lib/main_${{ inputs.flavor }}.dart
            -- --dart-define-from-file=env.json